<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f5f7fb;
      padding: 20px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .poll-container {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .option-card {
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #fff;
    }
    .option-card:hover {
      border-color: #3b82f6;
      background-color: #f0f6ff;
    }
    .option-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }
    .vote-count {
      font-size: 14px;
      color: #64748b;
    }
    /* CSS Bar 차트 스타일 */
    .bar-background {
      width: 100%;
      height: 12px;
      background-color: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 6px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .total-votes {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }
    .loading-overlay {
      text-align: center;
      padding: 10px;
      color: #3b82f6;
      font-size: 14px;
    }
    button.vote-btn {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button.vote-btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="poll-container">
  <h2>📊 프로젝트 방향성 투표</h2>
  
  <div id="poll-list">
    <div class="loading-overlay">결과를 불러오는 중...</div>
  </div>

  <div class="total-votes" id="total-count">총 투표수: 0표</div>
</div>

<script>
  let isVoting = false;

  // 페이지 로드 시 초기 투표 결과 불러오기
  window.onload = function() {
    loadResults();
  };

  /**
   * GET: 백엔드에서 최신 투표 결과 가져오기
   */
  function loadResults() {
    google.script.run
      .withSuccessHandler(renderPoll)
      .withFailureHandler(handleError)
      .getPollResults();
  }

  /**
   * 사용자 클릭 시 투표 등록 및 1 증가 처리
   */
  function submitVote(optionName) {
    if (isVoting) return;
    isVoting = true;
    
    // UI 로딩 표시
    const totalElem = document.getElementById('total-count');
    totalElem.innerText = "투표 반영 중...";

    google.script.run
      .withSuccessHandler((updatedResults) => {
        isVoting = false;
        renderPoll(updatedResults);
      })
      .withFailureHandler((err) => {
        isVoting = false;
        handleError(err);
      })
      .voteOption(optionName);
  }

  /**
   * 투표 결과를 바탕으로 백분율 계산 및 CSS Bar 차트 렌더링
   */
  function renderPoll(results) {
    const container = document.getElementById('poll-list');
    container.innerHTML = '';

    // 전체 투표 합계 계산
    const totalVotes = Object.values(results).reduce((acc, curr) => acc + curr, 0);
    document.getElementById('total-count').innerText = `총 투표수: ${totalVotes}표`;

    // 각 항목별 백분율 계산 및 DOM 생성
    Object.keys(results).forEach(option => {
      const count = results[option];
      // 백분율 계산 (0으로 나누기 방지)
      const percentage = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : 0;

      const card = document.createElement('div');
      card.className = 'option-card';
      card.onclick = () => submitVote(option);

      card.innerHTML = `
        <div class="option-header">
          <span>${option}</span>
          <span class="vote-count">${count}표 (${percentage}%)</span>
        </div>
        <div class="bar-background">
          <div class="bar-fill" style="width: ${percentage}%"></div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function handleError(error) {
    alert("오류가 발생했습니다: " + error.message);
    loadResults();
  }
</script>

</body>
</html>
