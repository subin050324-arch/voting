<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 선호도 투표</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f1f3f6;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      width: 90%;
      max-width: 520px;
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #202124;
      margin: 0 0 8px 0;
    }
    .subtitle {
      font-size: 14px;
      color: #70757a;
      margin-bottom: 28px;
    }
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .vote-btn {
      flex: 1;
      padding: 14px 10px;
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .vote-btn:hover {
      background-color: #f1f3f4;
      border-color: #bdc1c6;
    }
    .vote-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .results-section {
      text-align: left;
    }
    .bar-item {
      margin-bottom: 20px;
    }
    .bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 8px;
    }
    .bar-bg {
      width: 100%;
      height: 18px;
      background-color: #e8eaed;
      border-radius: 9px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background-color: #635bff;
      border-radius: 9px;
      transition: width 0.5s ease-in-out;
    }
    .footer-status {
      margin-top: 24px;
      font-size: 13px;
      color: #70757a;
      text-align: center;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #635bff;
      font-weight: 500;
      min-height: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>실시간 선호도 투표</h1>
  <div class="subtitle">원하는 항목을 클릭해 투표에 참여해 보세요.</div>

  <div class="button-group">
    <button class="vote-btn" onclick="handleVote('A안')">A안 투표</button>
    <button class="vote-btn" onclick="handleVote('B안')">B안 투표</button>
    <button class="vote-btn" onclick="handleVote('C안')">C안 투표</button>
  </div>

  <div class="results-section" id="chart-area"></div>

  <div class="footer-status" id="total-text">총 투표수: 0표</div>
  <div class="status-msg" id="status-msg"></div>
</div>

<script>
  // 본인의 Firebase Realtime Database URL 주소
  const FIREBASE_DB_URL = "https://my-first-app-1622f-default-rtdb.asia-southeast1.firebasedatabase.app";
  let isProcessing = false;

  window.onload = function() {
    loadData();
  };

  // REST API로 데이터 가져오기 (GET)
  async function loadData() {
    try {
      const res = await fetch(`${FIREBASE_DB_URL}/votes.json`);
      const data = await res.json() || {};
      
      const results = {
        "A안": data["A안"] || 0,
        "B안": data["B안"] || 0,
        "C안": data["C안"] || 0
      };
      
      renderChart(results);
    } catch (e) {
      document.getElementById('status-msg').innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
    }
  }

  // REST API로 투표수 1 증가시키기 (PUT)
  async function handleVote(option) {
    if (isProcessing) return;
    isProcessing = true;

    setButtonsDisabled(true);
    document.getElementById('status-msg').innerText = `'${option}'에 투표 반영 중...`;

    try {
      // 1. 현재 표수 확인
      const getRes = await fetch(`${FIREBASE_DB_URL}/votes/${encodeURIComponent(option)}.json`);
      let count = await getRes.json();
      if (count === null || isNaN(count)) count = 0;

      // 2. 표수 1 증가 후 업데이트
      await fetch(`${FIREBASE_DB_URL}/votes/${encodeURIComponent(option)}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(count + 1)
      });

      document.getElementById('status-msg').innerText = '';
      await loadData();
    } catch (e) {
      document.getElementById('status-msg').innerText = '투표 중 오류가 발생했습니다.';
    } finally {
      isProcessing = false;
      setButtonsDisabled(false);
    }
  }

  function renderChart(data) {
    const chartArea = document.getElementById('chart-area');
    chartArea.innerHTML = '';

    const total = Object.values(data).reduce((sum, val) => sum + val, 0);
    document.getElementById('total-text').innerText = `총 투표수: ${total}표`;

    Object.keys(data).forEach(option => {
      const count = data[option];
      const pct = total > 0 ? ((count / total) * 100).toFixed(1) : "0.0";

      const itemDiv = document.createElement('div');
      itemDiv.className = 'bar-item';
      itemDiv.innerHTML = `
        <div class="bar-header">
          <span>${option}</span>
          <span>${count}표 (${pct}%)</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" style="width: ${pct}%"></div>
        </div>
      `;
      chartArea.appendChild(itemDiv);
    });
  }

  function setButtonsDisabled(disabled) {
    const btns = document.querySelectorAll('.vote-btn');
    btns.forEach(btn => btn.disabled = disabled);
  }
</script>

</body>
</html>
